[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tamako"
version = "0.1.0"
description = "撮影素材を撮影順に並べ、不要区間を切り、顔をPNGで隠し、字幕を付けるまでの自動編集パイプライン"
requires-python = ">=3.9"
dependencies = [
    "imageio-ffmpeg>=0.5.1",
    "opencv-python>=4.9",
    "numpy>=1.24",
]

[project.optional-dependencies]
subtitle = ["faster-whisper>=1.0"]

[project.scripts]
tamako = "tamako.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 画面の HTML は配布物に入れる。packages.find だけでは .py しか入らない。
tamako = ["fixui.html"]
